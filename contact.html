<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cattoro Cafe - Contact Page</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <script type="module" src="js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <nav class="navbar md:navbar-expand bg-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Cattoro Cafe</a>

    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>

    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavLabel">Cattoro Cafe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Menu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

        </ul>

            <form class="hstack gap-2" role="search">
            <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <svg class="bi" width="16" height="16"><use href="#search"/></svg>
              </button>
            </form>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

<form style="max-width: 900px" class="mx-auto">

<div class="container mt-3">
      <div class="row g-4">

    <div class="md:col-6">
        <div class="form-field">
        <label for="fieldTextFN" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fieldTextFN" placeholder="John">
        <div class="form-text"></div>
        </div>
    </div>

    <div class="md:col-6">
        <div class="form-field">
        <label for="fieldTextLN" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="fieldTextLN" placeholder="Pork">
        <div class="form-text">
            will you answer his call..?
        </div>
        </div>
    </div>

    <div class="md:col-6">
        <div class="form-field">
        <label for="FormControlInputemail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="FormControlInputemail" placeholder="name@example.com">
        <div class="form-text">
        We’ll never share your email with anyone else.
        </div>
        </div>
    </div>

    <div class="md:col-6">
        <div class="form-field">
        <label for="FormControlSelect" class="form-label">Topic of Inquiry</label>
        <select class="form-control" id="FormControlSelect">
            <option>Choose one…</option>
            <option value="1">Events & Classes</option>
            <option value="2">Custom Orders & Catering</option>
            <option value="3">Adopt a Cat Program</option>
            <option value="4">Other</option>
        </select>
        </div>
    </div>

    <div class="form-field">
        <label for="FormControlTextarea" class="form-label">Inquiry</label>
        <textarea class="form-control" id="FormControlTextarea" rows="4"></textarea>
    </div>

    <div class="form-field">
        <input type="checkbox" id="checkDescription" class="check" />
        <div class="form-field-content">
        <label for="checkDescription">Consent check box</label>
    <small class="form-text">By clicking the check box I consent to the privacy policy & terms and conditions, I agree to allow Cattoro Cafe to collect my information.</small>
  </div>
</div>

<button class="btn-solid theme-primary mt-5">Submit</button>
</div>
    </div>
  </form>

    </body>
</html>
