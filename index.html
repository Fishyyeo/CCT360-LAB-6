<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cattoro Cafe - Home Page</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
        <script type="module" src="js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
    <nav class="navbar md:navbar-expand bg-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Cattoro Cafe</a>

    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>

    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavLabel">Cattoro Cafe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Menu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

        </ul>

            <form class="hstack gap-2" role="search">
            <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <svg class="bi" width="16" height="16"><use href="#search"/></svg>
              </button>
            </form>
        </ul>
      </div>
    </dialog>
    </div>
    </nav>

    <div id="carouselSI" class="carousel slide">
      <div class="carousel-inner rounded-5">

    <div class="carousel-item active">
      <img src="images/cookie.jpeg" class="d-block w-100 h-100" alt="Chocolate Chip Cookies">
    </div>
    <div class="carousel-item">
      <img src="images/lemon.JPG" class="d-block w-100 h-100" alt="Cheesecake Lemon Tarts">
    </div>
    <div class="carousel-item">
      <img src="images/cake.jpg" class="d-block w-100 h-100" alt="Strawberry Cake">
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center">
    <div>
      <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselSI" data-bs-slide="prev">
          <span class="carousel-icon-prev" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
      </button>
      <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselSI" data-bs-slide="next">
          <span class="carousel-icon-next" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
      </button>
    </div>
    
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselSI" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselSI" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselSI" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
      </div>
    </div>

    </body>
</html>
